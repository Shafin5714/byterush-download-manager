appId: com.byterush.app
productName: ByteRush
artifactName: ByteRush-Setup-${version}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - dist/**
  - resources/icon-16.png
  - resources/icon-256.png
  - package.json
extraResources:
  - from: resources/engine.exe
    to: engine.exe
win:
  target:
    - nsis
  icon: resources/icon-256.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
